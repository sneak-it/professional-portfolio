services:
  portfolio:
    image: ghcr.io/sneak-it/professional-portfolio:latest
    # For the hardened variant, switch to :latest-nonroot, uncomment `user`,
    # and make the mounted host dirs traversable by uid 65532:
    #   chmod o+rx content content/blog content/portfolio public/portfolio public/portfolio/photography
    # user: "65532:65532"
    container_name: professional-portfolio
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    # Site identity and canonical URL: copy .env.example to .env and edit.
    # Optional — every variable falls back to the default in .env.example.
    env_file:
      - path: .env
        required: false
    # The mounted host dirs must exist before starting:
    #   mkdir -p public/portfolio/photography
    volumes:
      - ./content:/app/content:ro
      - ./public/portfolio:/app/public/portfolio:ro
      # Images are same-origin only, so a custom SITE_AVATAR_URL needs its file
      # here. The tracked avatar-placeholder.png keeps the default working.
      - ./public/images:/app/public/images:ro
      # Persist the Next.js image optimizer cache
      - images-cache:/app/.next/cache/images
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "apparmor=docker-default"
      - "no-new-privileges=true"
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

volumes:
  images-cache: