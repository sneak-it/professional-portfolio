services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    # Host dirs must exist and be traversable by the container user (uid 1001):
    #   mkdir -p public/galleries
    #   chmod o+rx content content/blog content/galleries public/galleries
    volumes:
      - ./content:/app/content:ro
      - ./public/galleries:/app/public/galleries:ro
    restart: unless-stopped
    security_opt:
      - "apparmor=docker-default"
      - "no-new-privileges=true"
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'