services:
  portfolio:
    image: ghcr.io/sneak-it/professional-portfolio:latest
    # For the hardened variant, switch to :latest-nonroot and uncomment `user`.
    # No permission step either way: `cap_drop: ALL` takes DAC_OVERRIDE from root
    # too, so both variants read the mounts as an unprivileged user, and both are
    # satisfied by the world-readable modes a default umask already produces.
    # user: "65532:65532"
    container_name: professional-portfolio
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    # Site identity and canonical URL: copy .env.example to .env and edit.
    # Optional — every variable falls back to the default in .env.example.
    env_file:
      - path: .env
        required: false
    # Mounting ./media shadows the copy shipped in the image, so the host tree is
    # what gets served: it needs the SITE_AVATAR_URL file (default
    # media/images/avatar-placeholder.png) or the portrait renders blank. Nothing
    # here is served verbatim; app/media/[...path] strips EXIF on the way out.
    volumes:
      - ./content:/app/content:ro
      - ./media:/app/media:ro
      - ./public:/app/public:ro
      # Persist the Next.js image optimizer cache
      - images-cache:/app/.next/cache/images
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "apparmor=docker-default"
      - "no-new-privileges=true"
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

volumes:
  images-cache: