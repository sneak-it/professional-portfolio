services:
  portfolio:
    image: ghcr.io/sneak-it/professional-portfolio:latest-nonroot
    container_name: professional-portfolio
    environment:
      - NODE_ENV=production
    # Site identity and canonical URL: copy .env.example to .env and edit.
    # Optional — every variable falls back to the default in .env.example.
    env_file:
      - path: .env
        required: false
    # Host paths are created on first run if missing, and each shadows the copy
    # shipped in the image. Photographs are stripped on the way out regardless
    # (app/media/[...path]).
    volumes:
      - ./content:/app/content:ro
      - ./media/portfolio/photography:/app/media/portfolio/photography:ro
      # Optional: your own avatar and blog images, replacing the shipped ones.
      # - ./media/images:/app/media/images:ro
      # Optional, recommended: persist the Next.js image optimizer cache
      - images-cache:/app/.next/cache/images
      # Persist stripped photos, so each version is re-encoded once
      - media-cache:/app/.next/cache/media
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "apparmor=docker-default"
      - "no-new-privileges=true"
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

volumes:
  images-cache:
  media-cache:
