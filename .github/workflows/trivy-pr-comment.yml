name: Trivy PR Comment

# Runs AFTER the CI workflow completes.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: trivy-pr-comment-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read          # download artifacts from the triggering run (ci)

jobs:
  comment:
    name: Post Trivy report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same-repo PRs only, so the artifact always comes from code pushed with write access.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0]
    steps:
      - name: Download Trivy report artifact
        id: download
        uses: actions/download-artifact@v8
        continue-on-error: true   # CI may not have produced one (e.g. build failed early)
        with:
          name: trivy-pr-report
          path: trivy-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post/update sticky PR comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const read = (f) => {
              try { return fs.readFileSync(`trivy-artifact/${f}`, 'utf8').trim(); } catch (e) { return ''; }
            };

            const { owner, repo } = context.repo;
            const issue_number = context.payload.workflow_run.pull_requests[0].number;

            const LIMIT = 55000;
            const failed = read('trivy-outcome.txt') === 'failure';
            const report = read('trivy-report.txt');
            const status = failed ? '❌ HIGH/CRITICAL findings' : '✅ no HIGH/CRITICAL findings';
            const block = report.length > LIMIT
              ? report.slice(0, LIMIT) + '\n... (truncated; see the CI run summary for the full report)'
              : report;
            // A fence longer than any backtick run, so vulnerability titles cannot close it.
            const fence = '`'.repeat(Math.max(3, ...(block.match(/`+/g) || []).map(s => s.length + 1)));
            const details = report
              ? `<details><summary>Full report</summary>\n\n${fence}\n${block}\n${fence}\n\n</details>`
              : '_No report output was produced._';

            const marker = '<!-- trivy-image-scan -->';
            const body = `${marker}\n### 🛡️ Trivy image scan — ${status}\n\n${details}`;

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
