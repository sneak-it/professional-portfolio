name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  quality:
    name: Lint, Test, Build & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (fail on high vulnerabilities)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # On main, release-docker.yml already builds and scans both variants.
    if: github.ref != 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      # Building `production` builds `production-nonroot` as its parent stage, so
      # one build validates both published variants. They differ only by USER, so
      # their filesystems are identical and a single scan below covers both.
      - name: Build Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          load: true
          target: production
          tags: professional-portfolio:test
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      - name: Scan image
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: professional-portfolio:test
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          upload-artifact: ${{ github.event_name == 'pull_request' }}
          pr-number: ${{ github.event.pull_request.number }}
