name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  quality:
    name: Lint, Build & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (fail on high vulnerabilities)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # On main, release-docker.yml already builds and scans both variants.
    if: github.ref != 'refs/heads/main'

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: root
            target: production
          - variant: nonroot
            target: production-nonroot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build Docker image (${{ matrix.target }} stage)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          load: true
          target: ${{ matrix.target }}
          tags: professional-portfolio:test-${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        timeout-minutes: 10
        with:
          scan-type: image
          image-ref: professional-portfolio:test-${{ matrix.variant }}
          scanners: vuln,secret
          format: table
          output: trivy-report.txt
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      # Report is written to a file above, so surface it. Both steps run even when
      # the scan fails (exit 1), so the report is always visible; the job still fails.
      - name: Trivy report to job summary
        if: always()
        run: |
          {
            echo "### 🛡️ Trivy image scan (${{ matrix.variant }})"
            echo '```'
            cat trivy-report.txt 2>/dev/null || echo 'No report produced.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Hand the report to trivy-pr-comment workflow via artifact
      - name: Stage Trivy PR artifact
        if: always() && github.event_name == 'pull_request'
        run: |
          echo "${{ github.event.pull_request.number }}" > pr-number.txt
          echo "${{ steps.trivy.outcome }}" > trivy-outcome.txt

      - name: Upload Trivy PR artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-pr-report-${{ matrix.variant }}
          path: |
            trivy-report.txt
            pr-number.txt
            trivy-outcome.txt
          if-no-files-found: warn
          retention-days: 1
